<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinations - Memories</title>
  <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/rafflesia.png" />

</head>


<body>
<header>
  <h1 class="site-title"><a href="index.html" class="title-link"><img src="assets/rafflesia.png" class="site-logo" alt="Rafflesia">Memories</a></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="destinations.html" class="active">Destinations</a>
    <a href="favorites.html">My Trip</a>
        <a href="about.html">About Us</a>
  </nav>
</header>

<h2 class="title">All Destinations</h2>

<div class="controls-container">
  <div class="search-container">
    <input type="text" id="search" placeholder="Search destinations or states...">
  </div>
  <div class="filters-row">
    <div class="filter-group">
      <label for="sortSelect">Sort By:</label>
      <select id="sortSelect">
        <option value="name-asc" selected>Name (A - Z)</option>
        <option value="name-desc">Name (Z - A)</option>
        <option value="price-asc">Price (Low to High)</option>
        <option value="price-desc">Price (High to Low)</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="categoryFilter">Category:</label>
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="Beach">Beach</option>
        <option value="Nature">Nature</option>
        <option value="City">City</option>
        <option value="Culture">Culture</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="stateFilter">State:</label>
      <select id="stateFilter">
        <option value="all">All States</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="priceFilter">Price:</label>
      <select id="priceFilter">
        <option value="all">All Prices</option>
        <option value="free">Free Only</option>
        <option value="paid">Paid Only</option>
      </select>
    </div>
    <button id="resetBtn" class="btn-reset">Reset</button>
  </div>
</div>
<div class="note">
    <p>Note : The price is for <b>entrance fee</b> only.</p>
  </div>

<div id="destinations"></div>

<footer>
  <p>Made with ❤️ for Malaysia</p>
  <p class="footer-credit">Data & images sourced from various Malaysian tourism boards.</p>
</footer>

<script src="func.js"></script>
</body>
</html>
